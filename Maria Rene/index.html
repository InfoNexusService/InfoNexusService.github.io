<html lang="es-GT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dra. María Renee Argueta Mora</title>
<meta name="description" content="Dra. Maria Renee Argueta Mora - Medico General. Agenda tu cita por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#182953;
    --navy-2:#22376B;
    --sky:#7FA0D9;
    --sky-light:#EAF1FB;
    --white:#FFFFFF;
    --ink:#1B2438;
    --muted:#5C6A82;
    --radius-lg:24px;
    --radius-md:16px;
    --shadow: 0 14px 30px rgba(24,41,83,0.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito Sans', sans-serif;
    color:var(--ink);
    min-height:100vh;
    background: linear-gradient(180deg, var(--sky-light) 0%, #FFFFFF 60%);
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:440px;
    margin:0 auto;
    padding:38px 22px 34px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    text-align:center;
  }

  .photo-badge{
    width:168px;
    height:168px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:5px;
    background: linear-gradient(135deg, var(--sky), var(--navy));
    box-shadow: var(--shadow);
  }
  .photo-badge img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--white);
  }

  .name{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:1.55rem;
    color:var(--navy);
    margin:0 0 6px;
    line-height:1.3;
  }

  .specialty{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 16px;
    border-radius:999px;
    background:var(--sky-light);
    border:1px solid rgba(127,160,217,0.5);
    color:var(--navy-2);
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0 0 18px;
  }
  .specialty svg{width:14px;height:14px;}

  .tagline{
    font-size:0.94rem;
    color:var(--muted);
    line-height:1.55;
    margin:0 0 30px;
    padding:0 8px;
  }

  main{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:17px 20px;
    border-radius:var(--radius-lg);
    text-decoration:none;
    font-family:'Nunito Sans', sans-serif;
    font-weight:800;
    font-size:1rem;
    min-height:60px;
    border:none;
    cursor:pointer;
    transition:transform 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:3px solid var(--navy); outline-offset:3px;}

  .btn .icon{
    width:24px;height:24px;flex:0 0 24px;
    display:flex;align-items:center;justify-content:center;
  }
  .btn .icon svg{width:100%;height:100%;}
  .btn .label{flex:1;text-align:left;}
  .btn .chev svg{width:16px;height:16px;}

  .btn-primary{
    background: linear-gradient(135deg, var(--navy-2), var(--navy));
    color:var(--white);
    box-shadow: 0 14px 24px rgba(24,41,83,0.28);
  }
  .btn-primary .chev{color:rgba(255,255,255,0.85);}

  .btn-secondary{
    background:var(--white);
    color:var(--navy);
    border:2px solid rgba(24,41,83,0.12);
    box-shadow: 0 8px 16px rgba(24,41,83,0.06);
  }
  .btn-secondary .icon{color:var(--sky);}
  .btn-secondary .chev{color:var(--navy);}

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:30px 0 16px;
    color:#A9B4C6;
    font-size:0.72rem;
    letter-spacing:0.08em;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(24,41,83,0.12);
  }

  footer{
    margin-top:auto;
    padding-top:8px;
    text-align:center;
  }

  .cta-product{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(24,41,83,0.06);
    color:var(--navy);
    text-decoration:none;
    font-weight:700;
    font-size:0.85rem;
    border:1px solid rgba(24,41,83,0.10);
  }
  .cta-product svg{width:15px;height:15px;flex:0 0 15px;}

  .credit{
    margin-top:12px;
    font-size:0.7rem;
    color:#AAB4C0;
  }
</style>
</head>

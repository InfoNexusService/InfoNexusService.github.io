<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gau Miau Pet Shop</title>
<meta name="description" content="Gau Miau Pet Shop - escribe por WhatsApp, mira el catalogo y siguenos en redes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EA;
    --cream-2:#FFEFD8;
    --navy:#153261;
    --navy-2:#0F2547;
    --orange:#F3872E;
    --orange-2:#DA6E18;
    --gold:#F6B93B;
    --ink:#22303F;
    --white:#FFFFFF;
    --insta-1:#F58529;
    --insta-2:#DD2A7B;
    --insta-3:#8134AF;
    --fb:#1877F2;
    --radius-lg:26px;
    --radius-md:18px;
    --shadow-soft: 0 10px 24px rgba(21,50,97,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background-color: var(--cream);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(243,135,46,0.10) 0, transparent 40%),
      radial-gradient(circle at 88% 18%, rgba(246,185,59,0.14) 0, transparent 42%),
      radial-gradient(circle at 20% 92%, rgba(21,50,97,0.06) 0, transparent 40%);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 20px 40px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* decorative paw print pattern, single deliberate motif */
  .paw-row{
    display:flex;
    justify-content:space-between;
    padding:0 6px;
    opacity:0.55;
    margin-bottom:6px;
  }
  .paw-row svg{width:16px;height:16px;fill:var(--orange);opacity:0.5;}
  .paw-row svg:nth-child(2){fill:var(--navy);opacity:0.35;transform:translateY(4px);}
  .paw-row svg:nth-child(3){fill:var(--gold);opacity:0.6;}

  header{
    text-align:center;
    margin-top:6px;
  }

  .logo-badge{
    width:190px;
    height:190px;
    margin:0 auto 14px;
    border-radius:50%;
    background:var(--white);
    box-shadow: var(--shadow-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .logo-badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
  }

  .tagline{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:1.18rem;
    color:var(--navy);
    margin:2px 0 4px;
    line-height:1.35;
  }

  .subtext{
    font-size:0.95rem;
    color:#4C5A6B;
    margin:0 0 26px;
    line-height:1.5;
  }

  main{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    border-radius:var(--radius-lg);
    text-decoration:none;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:1.02rem;
    min-height:60px;
    border:none;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:3px solid var(--navy); outline-offset:3px;}

  .btn .icon{
    width:26px;height:26px;flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;
  }
  .btn .icon svg{width:100%;height:100%;}
  .btn .label{flex:1;text-align:left;}
  .btn .chev{opacity:0.55;flex:0 0 16px;}
  .btn .chev svg{width:16px;height:16px;}

  .btn-primary{
    background: linear-gradient(155deg, var(--orange), var(--orange-2));
    color:var(--white);
    box-shadow: 0 12px 22px rgba(218,110,24,0.35);
  }
  .btn-primary .chev{color:rgba(255,255,255,0.85);}

  .btn-secondary{
    background:var(--white);
    color:var(--navy);
    border:2px solid rgba(21,50,97,0.14);
    box-shadow: 0 8px 16px rgba(21,50,97,0.06);
  }
  .btn-secondary .chev{color:var(--navy);}

  .btn-instagram{
    background: linear-gradient(135deg, var(--insta-1), var(--insta-2) 55%, var(--insta-3));
    color:var(--white);
    box-shadow: 0 12px 20px rgba(221,42,123,0.25);
  }
  .btn-instagram .chev{color:rgba(255,255,255,0.85);}

  .btn-facebook{
    background: var(--fb);
    color:var(--white);
    box-shadow: 0 12px 20px rgba(24,119,242,0.25);
  }
  .btn-facebook .chev{color:rgba(255,255,255,0.85);}

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:30px 0 16px;
    color:#9AA6B4;
    font-size:0.78rem;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(21,50,97,0.12);
  }

  footer{
    margin-top:auto;
    padding-top:8px;
    text-align:center;
  }

  .cta-product{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(21,50,97,0.06);
    color:var(--navy);
    text-decoration:none;
    font-weight:700;
    font-size:0.85rem;
    border:1px solid rgba(21,50,97,0.10);
  }
  .cta-product svg{width:15px;height:15px;flex:0 0 15px;}

  .credit{
    margin-top:12px;
    font-size:0.7rem;
    color:#AAB4C0;
  }

  @media (min-width:520px){
    body{
      display:flex;
      justify-content:center;
    }
    .wrap{
      padding-top:44px;
    }
  }
</style>
</head>
